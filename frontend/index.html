<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SmartBuy — spec//lab · nghiên cứu trước khi mua gear</title>
  <meta name="description" content="Trợ lý nghiên cứu tai nghe, chuột, bàn phím trên dữ liệu Amazon Reviews 2023: tối đa ba lựa chọn, có lý do, đánh đổi và nguồn.">
  <meta name="theme-color" content="#f2f5fa">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232956d9'/%3E%3Cg stroke='%23ffffff' stroke-width='2.5' fill='none' stroke-linejoin='round'%3E%3Cpath d='M11 12V9a5 5 0 0 1 10 0v3M7 12h18l1 14H6zM12 19l3 3 5-6'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* Áp dụng lựa chọn đã lưu trước lần vẽ đầu. */
    (function () {
      var t = "light";
      try { if (localStorage.getItem("smartbuy.theme") === "dark") t = "dark"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
      if (t === "dark") document.querySelector('meta[name="theme-color"]').content = "#0e192d";
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>

  <div class="app" id="app">
    <div class="sidebar">
      <a class="brand-home" href="#/" aria-label="SmartBuy — về danh mục">
        <svg width="44" height="45" viewBox="0 0 44 45" fill="none" aria-hidden="true"><defs><linearGradient id="brand-gradient" x1="5" y1="5" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#6490ff"/><stop offset=".48" stop-color="#326afa"/><stop offset="1" stop-color="#174ac5"/></linearGradient></defs><path d="M14 16v-3a8 8 0 0 1 16 0v3M8 16h28l2 19a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4l2-19Z" stroke="url(#brand-gradient)" stroke-width="3.8" stroke-linejoin="round"/><path d="m18 27 3 3 6-7" stroke="url(#brand-gradient)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>SmartBuy</span>
      </a>
      <nav class="views" id="views" aria-label="Khu vực làm việc"></nav>
    </div>
    <header class="topbar">
      <button type="button" class="global-search" data-action="open-palette" aria-label="Tìm kiếm và mở bảng lệnh">
        <svg class="icon" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Tìm kiếm nhanh…</span><span class="global-search__keys"><kbd data-mod>Ctrl</kbd> <kbd>K</kbd></span>
      </button>
      <div class="tools" id="tools"></div>
    </header>

    <div class="workspace" id="workspace">
      <main class="stage" id="main" tabindex="-1"></main>
      <aside class="agent" id="agent" aria-label="Trợ lý nghiên cứu"></aside>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Điều hướng chính"></nav>
  </div>

  <div id="tray-root"></div>
  <div id="layer-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div class="visually-hidden" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <p style="padding:24px;font:16px/1.5 system-ui;color:var(--text);background:var(--bg)">SmartBuy cần JavaScript để chạy. Bật JavaScript rồi tải lại trang.</p>
  </noscript>
</body>
</html>
